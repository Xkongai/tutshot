name: Bug report
description: Something doesn't work or a screenshot looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the details below so we can reproduce the problem.
  - type: input
    id: version
    attributes:
      label: tutshot version
      description: Output of `tutshot --version`
      placeholder: "tutshot 0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "3.12.4"
    validations:
      required: true
  - type: textarea
    id: fonts
    attributes:
      label: Fonts
      description: Output of `tutshot fonts`
      render: text
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story file
      description: The tutshot.yml you rendered (or a minimal one that reproduces the problem). Please remove any private content.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Command and error output
      description: The exact command and its full output / traceback. For visual problems, attach the PNG.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
